
uid = "e8b511e8-9730-27c3-ea0b-879f6e1271a1aba83af9"
type = "web_pixel_extension"
name = "Experli events"
runtime_context = "strict"

# Wat deze pixel van je vraagt, en wat niet.
#
# Zonder dit blok gaat Shopify uit van marketing én analytics én verkoop van
# gegevens, en dan draait hij pas als iemand voor alle drie toestemming geeft.
# Dat is hier onnodig streng: dit meet alleen hoe ver iemand in de kassa komt,
# voor jouw eigen trechter. Er gaat niets naar een advertentienetwerk en er
# wordt niets doorverkocht.
#
# Analytics dus wel, de rest niet - dan draait hij voor iedereen die analytics
# goedkeurt in plaats van alleen voor wie alles goedkeurt.
[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.endpoint]
name = "Endpoint"
description = "Where the events are sent."
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]

[settings.fields.shop]
name = "Shop"
description = "Your shop domain, so the endpoint knows who this is from."
type = "single_line_text_field"
validations = [{ name = "min", value = "1" }]
