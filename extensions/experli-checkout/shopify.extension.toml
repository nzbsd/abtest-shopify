api_version = "2025-10"

[[extensions]]
uid = "9b3c8781-ee2e-9076-3355-d5d9517a1b59c60f07a5"
type = "ui_extension"
name = "Experli checkout"
handle = "experli-checkout"

# Eén blok, dat jij zelf in de kassa-editor neerzet waar je het hebben wilt.
#
# Bewust géén vaste plek. Een blok dat de app zelf inhaakt komt altijd op de
# plaats die de app het handigst vond, en dat is zelden de plaats waar het in
# jouw kassa hoort. Zo bepaal jij de plek één keer, en gebruikt elke volgende
# kassatest hem zonder dat je de editor weer in hoeft.
[[extensions.targeting]]
target = "purchase.checkout.block.render"
module = "./src/Blok.jsx"

[extensions.capabilities]
# De extensie draait in een web worker met een null-origin en moet de lopende
# tests bij de app ophalen; zonder dit staat elke fetch geblokkeerd.
network_access = true

[extensions.settings]

[[extensions.settings.fields]]
key = "app_url"
type = "single_line_text_field"
name = "Experli URL"
description = "Waar de app draait. Laat dit staan tenzij Experli ergens anders gehost wordt."
