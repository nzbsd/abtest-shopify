# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e0127103f68c3a5e74136d4f68fcf9ad"
name = "Experli"
handle = "herbies-price-test"

application_url = "https://abtest-shopify.vercel.app"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Zonder deze blijft de opgeslagen sessie de oude scopes dragen nadat je er
  # een hebt toegevoegd en gedeployd - de app werkt dan met een verouderd beeld
  # van wat hij mag, en dat is van buiten niet te zien.
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Alleen lezen. De app wijzigt geen prijzen en schrijft geen kortingen: de
# testprijs staat op het duplicaat, dat jij zelf in Shopify beheert.
# read_products om producten en varianten te koppelen, read_orders voor de
# omzet per testgroep.
# write_pixels en read_customer_events zijn voor de web pixel: die meet wat er
# in de kassa gebeurt, waar themacode niet draait.
# write_delivery_customizations en write_discounts zijn de enige schrijfrechten
# die deze app vraagt, allebei alleen voor een verzend-kassatest. Verzendopties
# en verzendkortingen zijn nergens anders te
# beinvloeden dan met een delivery customization, en die moet Experli zelf
# aanmaken - jou vragen om met de hand JSON in een metafield te plakken zou
# stil fout te doen zijn: een typefout geeft geen melding maar een Function
# die niets doet, en dan loopt er een test die nul verschil rapporteert.
scopes = "read_products,read_orders,read_themes,write_pixels,read_customer_events,read_shipping,write_delivery_customizations,write_discounts"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://abtest-shopify.vercel.app/auth/callback" ]

[pos]
embedded = false
