# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e0127103f68c3a5e74136d4f68fcf9ad"
name = "Price Test"
handle = "price-test-1"

# LET OP: pas dit aan zodra het Vercel-project bestaat. Heet het project daar
# anders dan herbies-price-test, dan klopt deze URL niet en mislukt de
# installatie met een redirect-fout.
application_url = "https://herbies-price-test.vercel.app"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# write_products is nodig om vaste prijzen in een price list te zetten.
# write_discounts om het metafield van de automatische korting te schrijven.
# read_orders voor de omzet per testgroep.
scopes = "read_products,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://herbies-price-test.vercel.app/auth/callback" ]

[pos]
embedded = false
