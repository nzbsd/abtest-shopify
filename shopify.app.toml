# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "e0127103f68c3a5e74136d4f68fcf9ad"
name = "Price Test"
handle = "herbies-price-test"

application_url = "https://abtest-shopify.vercel.app"
embedded = true

[webhooks]
api_version = "2026-07"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Alleen lezen. De app wijzigt geen prijzen en schrijft geen kortingen: de
# testprijs staat op het duplicaat, dat jij zelf in Shopify beheert.
# read_products om producten en varianten te koppelen, read_orders voor de
# omzet per testgroep.
scopes = "read_products,read_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [ "https://abtest-shopify.vercel.app/auth/callback" ]

[pos]
embedded = false
